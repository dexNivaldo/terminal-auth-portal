<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hatch — generate terminal authentication tokens for TAS and DPE."
    />
    <meta name="theme-color" content="#E5173A" />
    <title>Hatch · Terminal Auth Portal</title>
    <script>
      (function () {
        try {
          var forced = new URLSearchParams(window.location.search).get('theme');
          var stored = localStorage.getItem('theme');
          var dark =
            forced === 'dark' ||
            (forced !== 'light' &&
              (stored === 'dark' ||
                (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)));
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
